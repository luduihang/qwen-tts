# qwen-tts 配置样例 —— 复制为 config.yaml 后按需修改（config.yaml 已 gitignore，可含敏感信息）

asr:
  provider: local                      # local | remote
  url: http://192.168.0.190:8001/v1/audio/transcriptions  # 完整端点 URL（局域网 vLLM）
  api_key: ""                          # remote 必填，local 可空
  model: Qwen3-ASR-1.7B                # 透传给端点
  language: ""                         # 可选，透传给端点；空 = 不发送（Qwen3-ASR-1.7B vLLM 端点传 language=zh 会重复循环）
  temperature: 0.0                     # 透传给端点
output_dir: ./output
temp_dir: ./temp
bilibili:
  cookie: ""                           # 可选
timeout:
  download_s: 300
  asr_s: 600
